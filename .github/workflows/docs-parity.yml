name: docs-parity

# Catches the MECHANICAL half of documentation drift. It cannot tell you that a
# paragraph has gone stale, but it can tell you that the two runbook mirrors no
# longer agree, that a fence is unclosed, that the five plugin manifests
# disagree on a version, or that a pinned SSH fingerprint stopped matching.
#
# Why this exists: between 2026-08-19 and 2026-08-22, twelve commits changed
# AGENTS.md without touching README.md, and the two mirrors drifted by two lines
# without anyone noticing. Issue #34 asked to "re-run the doc-consistency checks
# this repo already uses"; there were none, only prose telling a maintainer to
# remember. This is that, made mandatory.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Runbook mirrors are byte-identical below their headers
        run: |
          set -euo pipefail
          SK=skills/amarel-vscode-setup/SKILL.md
          # Locate the frontmatter end dynamically (the second '---') so that
          # reordering the frontmatter cannot break this check. SKILL.md's own
          # header runs for 24 lines past it, hence the +25 offset.
          FM=$(awk 'NR>1 && /^---$/{print NR; exit}' "$SK")
          if [ -z "${FM:-}" ]; then
            echo "ERR: could not find the end of SKILL.md's YAML frontmatter" >&2
            exit 1
          fi
          if ! diff <(tail -n +51 AGENTS.md) <(tail -n +$((FM + 25)) "$SK"); then
            echo >&2
            echo "ERR: AGENTS.md and SKILL.md have drifted." >&2
            echo "Rebuild the mirror instead of hand-applying the edit twice:" >&2
            echo "  { head -82 $SK; tail -n +51 AGENTS.md; } > /tmp/s && mv /tmp/s $SK" >&2
            exit 1
          fi
          echo "OK: mirrors identical"

      - name: Phase heading titles match
        run: |
          set -euo pipefail
          diff <(grep -E '^#{2,4} (Phase )?[0-9]' AGENTS.md) \
               <(grep -E '^#{2,4} (Phase )?[0-9]' skills/amarel-vscode-setup/SKILL.md)
          echo "OK: $(grep -cE '^#{2,4} (Phase )?[0-9]' AGENTS.md) phase headings agree"

      - name: Code fences are balanced, and the mirrors agree on the count
        run: |
          set -euo pipefail
          rc=0
          for f in README.md GEMINI.md CLAUDE.md docs/index.md \
                   docs/source-control-git-fix.md AGENTS.md \
                   skills/amarel-vscode-setup/SKILL.md; do
            n=$(grep -c '^```' "$f" || true)
            if [ $((n % 2)) -ne 0 ]; then
              echo "ERR: $f has $n fence markers, an odd number, so one is unclosed" >&2
              rc=1
            else
              printf 'OK: %-45s %s fences\n' "$f" "$n"
            fi
          done
          a=$(grep -c '^```' AGENTS.md || true)
          s=$(grep -c '^```' skills/amarel-vscode-setup/SKILL.md || true)
          if [ "$a" -ne "$s" ]; then
            echo "ERR: AGENTS.md has $a fences but SKILL.md has $s" >&2
            rc=1
          fi
          exit "$rc"

      - name: All five plugin manifests agree on name and version
        run: |
          set -euo pipefail
          # Do the whole comparison in python. An earlier shell version of this
          # step FAILED OPEN: if the lookup returned nothing, `printf '%s\n' ""`
          # still emitted one line, `wc -l` said 1, and "all five agree" passed
          # having read zero versions. Assert the count and reject empties.
          python3 - <<'PYEOF'
          import json, sys

          FILES = [
              ".claude-plugin/plugin.json",
              ".claude-plugin/marketplace.json",
              ".codex-plugin/plugin.json",
              ".agents/plugins/marketplace.json",
              "gemini-extension.json",
          ]

          found = {}
          for f in FILES:
              d = json.load(open(f))
              # A marketplace manifest carries the version under plugins[0]; a
              # plugin manifest carries it at the top level.
              v = d.get("version") or (d.get("plugins") or [{}])[0].get("version")
              name = d.get("name") or (d.get("plugins") or [{}])[0].get("name")
              if not v:
                  sys.exit(f"ERR: {f} has no version (top level or plugins[0])")
              if name != "amarel-vscode":
                  sys.exit(f"ERR: {f} name is {name!r}, expected 'amarel-vscode'")
              found[f] = v

          if len(found) != len(FILES):
              sys.exit(f"ERR: read {len(found)} manifests, expected {len(FILES)}")

          distinct = sorted(set(found.values()))
          if len(distinct) != 1:
              for f, v in found.items():
                  print(f"  {v}  {f}")
              sys.exit(f"ERR: manifest versions disagree: {distinct}")

          print(f"OK: all {len(FILES)} manifests at {distinct[0]}, name amarel-vscode")
          PYEOF
          if ! grep -q "PLUGIN_NAME=\"amarel-vscode\"" install.sh; then
            echo "ERR: install.sh PLUGIN_NAME no longer matches the manifests" >&2
            exit 1
          fi
          echo "OK: install.sh PLUGIN_NAME matches"

      - name: The two SSH fingerprint pins agree across all three copies
        run: |
          set -euo pipefail
          # The pins are a security constant and live in exactly three places:
          # both setup scripts and the Phase 2.2 block in AGENTS.md (mirrored to
          # SKILL.md, which the first step already proves identical). CLAUDE.md
          # and GEMINI.md deliberately carry NO pin values; a truncated fourth
          # and fifth copy is what this check was written after removing.
          pins=$(grep -rhoE 'SHA256:[A-Za-z0-9+/=]{40,}' \
                   scripts/setup.sh scripts/setup.ps1 AGENTS.md | sort -u)
          count=$(printf '%s\n' "$pins" | grep -c . || true)
          if [ "$count" -ne 2 ]; then
            echo "ERR: expected exactly 2 distinct full pins, found $count:" >&2
            printf '%s\n' "$pins" >&2
            echo "Each host's pin must be byte-identical in all three files." >&2
            exit 1
          fi
          for f in scripts/setup.sh scripts/setup.ps1 AGENTS.md; do
            n=$(grep -coE 'SHA256:[A-Za-z0-9+/=]{40,}' "$f" || true)
            [ "$n" -ge 2 ] || { echo "ERR: $f carries $n full pins, expected 2" >&2; exit 1; }
          done
          echo "OK: 2 distinct pins, present in all three files"
          if grep -qE 'SHA256:[A-Za-z0-9+/=]{1,20}…' CLAUDE.md GEMINI.md; then
            echo "ERR: a truncated pin reappeared in CLAUDE.md or GEMINI.md." >&2
            echo "Point at AGENTS.md Phase 2.2 instead of copying the value." >&2
            exit 1
          fi
          echo "OK: no truncated pin copies"
