name: Build and release sysroot tarball

# Builds the VS Code Server custom-glibc sysroot tarball on a NATIVE x86_64
# runner (ubuntu-latest) and publishes it to a GitHub Release. This is the
# durable answer to the arm64/QEMU build failure documented in SKILL.md /
# AGENTS.md Phase 6.3: crosstool-NG/GMP cannot build under qemu-emulated
# linux/amd64 on Apple Silicon, but builds cleanly on a real x86_64 host.
#
# It wraps scripts/build-sysroot.sh unchanged — the script already pins the
# ursetto commit and the patchelf version and prints both SHA-256s.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string

# Least privilege: only the permission needed to create a release + its tag.
permissions:
  contents: write

# Never run two release builds for the same tag at once.
concurrency:
  group: build-and-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Resolved by Actions, then consumed only as "$TAG" in run-steps — never
      # interpolated inline into a shell command, so a crafted tag cannot inject.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # Pin the release tag to the exact commit that was checked out and built, so
      # a workflow_dispatch run cannot silently tag default-branch HEAD instead.
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        # A full crosstool-NG/glibc-2.28/gcc source build inside Docker layers can
        # exhaust the ~21 GB free on ubuntu-latest. Reclaim space the toolchain
        # build does not need before starting (best-effort; never fail the build).
        run: |
          set -uo pipefail
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "After:"; df -h /

      - name: Build sysroot tarball (native x86_64 Docker — no QEMU)
        run: |
          set -euo pipefail
          chmod +x scripts/build-sysroot.sh
          ./scripts/build-sysroot.sh

      - name: Compute checksums
        id: checksums
        run: |
          set -euo pipefail
          TARBALL="build/vscode-sysroot-x86_64-linux-gnu.tgz"
          PATCHELF="build/work/patchelf-0.18.0-x86_64.tar.gz"
          test -f "$TARBALL" || { echo "ERR: tarball not produced at $TARBALL" >&2; exit 1; }

          {
            echo "# SHA-256 checksums for artifacts the setup scripts download."
            echo "# Format: <sha256>  <filename>"
            echo "# Generated by .github/workflows/build-and-release.yml for $TAG"
            echo
            sha256sum "$TARBALL"   | awk '{print $1"  vscode-sysroot-x86_64-linux-gnu.tgz"}'
            if [ -f "$PATCHELF" ]; then
              sha256sum "$PATCHELF" | awk '{print $1"  patchelf-0.18.0-x86_64.tar.gz"}'
            else
              echo "WARN: patchelf tarball not found at $PATCHELF — checksums.txt omits it" >&2
            fi
          } > build/checksums.txt

          echo "## Sysroot build \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy these into \`assets/checksums.txt\`:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^#' build/checksums.txt | sed '/^$/d' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build release notes
        run: |
          set -euo pipefail
          URSETTO_COMMIT=$(awk -F'"' '/^URSETTO_COMMIT=/{print $2}' scripts/build-sysroot.sh)
          {
            echo "VS Code Server custom-glibc sysroot tarball (patchelf 0.18.0 spliced in)."
            echo
            echo "Built on a native \`ubuntu-latest\` x86_64 runner from"
            echo "\`ursetto/vscode-sysroot\` @ \`${URSETTO_COMMIT:-see scripts/build-sysroot.sh}\`."
            echo
            echo "**SHA-256 (also in \`checksums.txt\` asset):**"
            echo '```'
            grep -v '^#' build/checksums.txt | sed '/^$/d'
            echo '```'
            echo
            echo "Setup scripts pull this from \`releases/latest/download/...\`, so a new"
            echo "release becomes the default automatically. Remember to update"
            echo "\`assets/checksums.txt\` in the repo to match the values above."
          } > build/release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-sysroot-x86_64-linux-gnu
          path: |
            build/vscode-sysroot-x86_64-linux-gnu.tgz
            build/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          ASSETS=(build/vscode-sysroot-x86_64-linux-gnu.tgz build/checksums.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating assets."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file build/release-notes.md
          fi
